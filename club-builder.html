    },
    updateProfile: function(patch){
      Object.assign(state.user, patch || {});
      save(state); FT.syncUI();
      window.dispatchEvent(new CustomEvent('fantrade:statechange', { detail: state }));
    },
    setPref: function(key, val){
      state.prefs[key] = val; save(state);
      window.dispatchEvent(new CustomEvent('fantrade:statechange', { detail: state }));
    },
    isFav: function(id){ return (state.favourites || []).indexOf(id) > -1; },
    toggleFav: function(id){
      state.favourites = state.favourites || [];
      var i = state.favourites.indexOf(id);
      if(i > -1) state.favourites.splice(i, 1); else state.favourites.push(id);
      save(state);
      window.dispatchEvent(new CustomEvent('fantrade:statechange', { detail: state }));
      return i === -1;
    },
    readAll: function(){
      (state.notifications || []).forEach(function(n){ n.read = true; });
      save(state); FT.syncUI();
      window.dispatchEvent(new CustomEvent('fantrade:statechange', { detail: state }));
    },
    readOne: function(id){
      var n = (state.notifications || []).filter(function(x){ return x.id === id; })[0];
      if(n && !n.read){ n.read = true; save(state); FT.syncUI(); }
    },
    executeTrade: function(side, assetSymbol, assetName, shares, price, isCoach){
      var subtotal = shares * price;
      var fee = subtotal * 0.004;
      var total = Math.round(side === 'buy' ? subtotal + fee : subtotal - fee);

      if(side === 'buy'){
        if(state.wallet.balance < total){
          throw new Error("Insufficient $FTR balance (" + state.wallet.balance.toLocaleString('en-US') + " $FTR available, need " + total.toLocaleString('en-US') + " $FTR).");
        }
        state.wallet.balance -= total;
        if(!state.holdings[assetSymbol]){
          state.holdings[assetSymbol] = { n: assetName, shares: 0, avg: price, p: price, c: isCoach, inClub: isCoach ? 'COACH' : 'SUB' };
        }
        var cur = state.holdings[assetSymbol];
        var newTotal = cur.shares + shares;
        cur.avg = ((cur.shares * cur.avg) + (shares * price)) / newTotal;
        cur.shares = newTotal;
        cur.p = price;
      } else {
        var cur = state.holdings[assetSymbol];
        if(!cur || cur.shares < shares){
          throw new Error("You only hold " + (cur ? cur.shares.toLocaleString('en-US') : "0") + " shares of " + assetSymbol + ".");
        }
        state.wallet.balance += total;
        cur.shares -= shares;
        if(cur.shares <= 0){
          delete state.holdings[assetSymbol];
        }
      }

      state.transactions.unshift({
        type: side.toUpperCase(),
        asset: assetSymbol,
        shares: shares,
        price: price,
        total: total,
        time: "Just now"
      });

      save(state);
      FT.syncUI();
      window.dispatchEvent(new CustomEvent('fantrade:statechange', { detail: state }));

      // Authoritative PostgreSQL backend sync
      if(window.FantradeAPI && typeof window.FantradeAPI.placeOrder === 'function'){
        window.FantradeAPI.placeOrder({
          assetSymbol: assetSymbol,
          side: side.toUpperCase(),
          quantity: shares,
          limitPrice: price
        }).then(function(res){
          console.log('[FantradeAPI] Order matched & recorded on PostgreSQL backend:', res);
          if(window.FantradeAPI.getWallet && window.FantradeAPI.getPortfolio){
            Promise.all([window.FantradeAPI.getWallet(), window.FantradeAPI.getPortfolio()]).then(function(results){
              var w = results[0] && results[0].wallet;
              var p = results[1] && results[1].portfolio;
              if(w){
                state.wallet.balance = Math.round(w.availableFtr);
                state.wallet.locked = Math.round(w.reservedFtr);
              }
              if(p && p.holdings){
                p.holdings.forEach(function(h){
                  var sym = '$' + h.assetSymbol.replace(/^\$/, '');
                  if(!state.holdings[sym]){
                    state.holdings[sym] = { n: h.assetName, shares: h.quantity, avg: h.averageCost, p: h.currentPrice, c: isCoach, inClub: isCoach ? 'COACH' : 'SUB' };
                  } else {
                    state.holdings[sym].shares = h.quantity;
                    state.holdings[sym].avg = h.averageCost;
                    state.holdings[sym].p = h.currentPrice;
                  }
                });
              }
              save(state);
              FT.syncUI();
              window.dispatchEvent(new CustomEvent('fantrade:statechange', { detail: state }));
            }).catch(function(){});
          }
        }).catch(function(err){
          console.warn('[FantradeAPI] Live order sync notice:', err.message);
        });
      }

      return { total: total, remainingBalance: state.wallet.balance, shares: shares };
    },
    saveClub: function(clubData, id){
      var target = id
        ? state.clubs.filter(function(c){ return c.id === id; })[0]
        : state.club;
      if(!target) throw new Error("That club no longer exists.");
      Object.assign(target, clubData);
      save(state);
      FT.syncUI();
      window.dispatchEvent(new CustomEvent('fantrade:statechange', { detail: state }));
      return target;
    },
    clubs: function(){ return state.clubs; },
    activeClubId: function(){ return state.activeClub; },
    getClub: function(id){
      return state.clubs.filter(function(c){ return c.id === id; })[0] || state.club;
    },
    createClub: function(clubData){
      if(state.clubs.length >= 6){
        throw new Error("Six clubs is the limit for one manager.");
      }
      var name = (clubData.name || '').trim();
      if(name.length < 2){ throw new Error("Give the club a name first."); }
      if(state.clubs.filter(function(c){ return c.name.toLowerCase() === name.toLowerCase(); }).length){
        throw new Error("You already have a club called " + name + ".");
      }
      var club = Object.assign({
        id: 'c-' + Date.now(),
        stadium: "Unnamed ground",
        colors: ["#1800ad", "#0f0075"],
        colorName: "Indigo",
        formation: "4-3-3",
        coach: "$Arteta",
        rank: 900 + state.clubs.length,
        fp: 0,
        boost: 0,
        value: 0,
        division: "Challenger"
      }, clubData, { name: name });
      state.clubs.push(club);
      state.activeClub = club.id;
      link(state);
      save(state);
      FT.syncUI();
      window.dispatchEvent(new CustomEvent('fantrade:statechange', { detail: state }));
      return club;
    },
    switchClub: function(id){
      if(!state.clubs.filter(function(c){ return c.id === id; }).length){
        throw new Error("That club no longer exists.");
      }
      state.activeClub = id;
      link(state);
      save(state);
      FT.syncUI();
      window.dispatchEvent(new CustomEvent('fantrade:statechange', { detail: state }));
      return state.club;
    },
    deleteClub: function(id){
      if(state.clubs.length < 2){ throw new Error("Your last club cannot be deleted."); }
      var staked = (state.fanplay.activeEntries || []).filter(function(e){ return e.clubId === id; });
      if(staked.length){ throw new Error("That club has a live entry. It settles before you can delete it."); }
      state.clubs = state.clubs.filter(function(c){ return c.id !== id; });
      if(state.activeClub === id) state.activeClub = state.clubs[0].id;
      link(state);
      save(state);
      FT.syncUI();
      window.dispatchEvent(new CustomEvent('fantrade:statechange', { detail: state }));
    },
    activateFanPlayEntry: function(entryData){
      var stake = entryData.stake || 2500;
      if(state.wallet.balance < stake){
        throw new Error("Insufficient $FTR balance. Need " + stake.toLocaleString('en-US') + " $FTR.");
      }
      state.wallet.balance -= stake;
      state.wallet.locked += stake;
      // one club can hold one live entry, so a diversified manager stakes each separately
      if(entryData.clubId){
        var dup = (state.fanplay.activeEntries || []).filter(function(e){
          return e.clubId === entryData.clubId;
        })[0];
        if(dup){
          state.wallet.balance += stake;
          state.wallet.locked -= stake;
          throw new Error(entryData.target + " already has a live entry this round.");
        }
      }
      var newEntry = {
        id: "e-" + Date.now(),
        mode: entryData.mode,
        clubId: entryData.clubId || "",
        target: entryData.target,
        tier: entryData.tier,
        mult: entryData.mult,
        stake: stake,
        projectedFP: entryData.projectedFP,
        status: "Active in MD 07"
      };
      state.fanplay.activeEntries.unshift(newEntry);
      state.transactions.unshift({
        type: "STAKE",
        asset: "FanPlay MD 07 (" + entryData.tier + ")",
        shares: 1,
        price: stake,
        total: stake,
        time: "Just now"
      });
      save(state);
      FT.syncUI();
      window.dispatchEvent(new CustomEvent('fantrade:statechange', { detail: state }));
      return newEntry;
    },
    convertGbp: function(gbpAmount){
      var grossFtr = gbpAmount * state.wallet.gbpRate;
      var fee = grossFtr * 0.005;
      var netFtr = Math.round(grossFtr - fee);
      state.wallet.balance += netFtr;
      state.transactions.unshift({
        type: "CONVERT",
        asset: "GBP Deposit (£" + gbpAmount.toLocaleString('en-US') + ")",
        shares: gbpAmount,
        price: state.wallet.gbpRate,
        total: netFtr,
        time: "Just now"
      });
      save(state);
      FT.syncUI();
      window.dispatchEvent(new CustomEvent('fantrade:statechange', { detail: state }));
      return netFtr;
    },
    sendFtr: function(amount, dest, kind){
      if(amount <= 0) throw new Error("Enter an amount to send.");
      var fee = kind === 'withdraw' ? Math.max(50, Math.round(amount * 0.005)) : 0;
      if(state.wallet.balance < amount + fee){
        throw new Error("Insufficient $FTR. You have " + state.wallet.balance.toLocaleString('en-US')
          + " and this needs " + (amount + fee).toLocaleString('en-US') + ".");
      }
      state.wallet.balance -= (amount + fee);
      state.transactions.unshift({
        type: kind === 'withdraw' ? "WITHDRAW" : "SEND",
        asset: dest, shares: 1, price: amount, total: amount + fee, time: "Just now"
      });
      save(state); FT.syncUI();
      window.dispatchEvent(new CustomEvent('fantrade:statechange', { detail: state }));
      return { sent: amount, fee: fee, remaining: state.wallet.balance };
    },
    swapAssets: function(fromSym, toSym, shares, prices){
      var from = state.holdings[fromSym];
      if(!from) throw new Error("You do not hold any " + fromSym + ".");
      if(from.shares < shares) throw new Error("You hold " + from.shares.toLocaleString('en-US')
        + " " + fromSym + ", not " + shares.toLocaleString('en-US') + ".");
      var gross = shares * from.p, fee = gross * 0.004, net = gross - fee;
      var toPrice = prices[toSym];
      if(!toPrice) throw new Error("No market price for " + toSym + ".");
      var got = Math.floor(net / toPrice);
      if(got < 1) throw new Error("That is not enough to buy a whole share of " + toSym + ".");

      from.shares -= shares;
      if(from.shares <= 0) delete state.holdings[fromSym];
      if(!state.holdings[toSym]){
        state.holdings[toSym] = { n: prices[toSym + ':name'] || toSym, shares: 0, avg: toPrice,
          p: toPrice, c: !!prices[toSym + ':coach'], inClub: 'SUB' };
      }
      var to = state.holdings[toSym];
      to.avg = ((to.shares * to.avg) + (got * toPrice)) / (to.shares + got);
      to.shares += got;
      to.p = toPrice;
      state.wallet.balance += Math.round(net - got * toPrice);

      state.transactions.unshift({
        type: "SWAP", asset: fromSym + " → " + toSym, shares: shares,
        price: from.p, total: Math.round(gross), time: "Just now"
      });
      save(state); FT.syncUI();
      window.dispatchEvent(new CustomEvent('fantrade:statechange', { detail: state }));
      return { spent: shares, received: got, fee: Math.round(fee) };
    },
    depositFtr: function(amount){
      state.wallet.balance += amount;
      state.transactions.unshift({
        type: "DEPOSIT",
        asset: "Direct Deposit",
        shares: 1,
        price: amount,
        total: amount,
        time: "Just now"
      });
      save(state);
      FT.syncUI();
      window.dispatchEvent(new CustomEvent('fantrade:statechange', { detail: state }));
    },
    resetState: function(){
      state = link(JSON.parse(JSON.stringify(defaultState)));
      save(state);
      FT.syncUI();
      window.dispatchEvent(new CustomEvent('fantrade:statechange', { detail: state }));
    }
  };
})();

// Toast Notification
function showToast(msg, type){
  type = type || 'success';
  var cont = document.getElementById('ftToastContainer');
  if(!cont) return;
  var el = document.createElement('div');
  el.className = 'ft-toast ' + type;
  var icon = type==='success'
    ? '<svg class="t-icon" aria-hidden="true"><use href="#i-check"/></svg>'
    : (type==='error' ? '<svg class="t-icon" aria-hidden="true"><use href="#i-cross"/></svg>'
    : '<svg class="t-icon" aria-hidden="true"><use href="#i-coin"/></svg>');
  el.innerHTML = icon + '<span>' + msg + '</span>';
  cont.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('show'); });
  setTimeout(function(){
    el.classList.remove('show');
    setTimeout(function(){ el.remove(); }, 400);
  }, 3600);
}

function openModal(html){
  var bd = document.getElementById('ftModalBackdrop');

  var bd = document.getElementById('ftModalBackdrop');
  if(!bd) return;
  bd.classList.remove('open');
  setTimeout(function(){ bd.style.display = 'none'; }, 260);
}

});

// Account dropdown
(function(){
  var trigger = document.getElementById('navAccountBtn');
  var menu = document.getElementById('navMenu');
  if(!trigger || !menu) return;
  function setOpen(open){
    menu.classList.toggle('open', open);
    trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  trigger.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    setOpen(!menu.classList.contains('open'));
  });
  document.addEventListener('click', function(e){
    if(menu.classList.contains('open') && !menu.contains(e.target) && e.target !== trigger) setOpen(false);
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && menu.classList.contains('open')){ setOpen(false); trigger.focus(); }
  });
})();

  return '<span class="rc" style="background:linear-gradient(160deg,' + c.colors[0] + ','
    + (c.colors[1] || c.colors[0]) + ')">'
    + c.name.split(/\s+/).map(function(w){ return w.charAt(0).toUpperCase(); }).join('').slice(0,3)
    + '</span>';
}
function renderRail(){
  var rail = document.getElementById('clubRail');
  if(!rail) return;
  var s = FT.getState();
  rail.innerHTML = s.clubs.map(function(c){
    return '<button class="clubchip" type="button" data-club="' + c.id + '"'
      + (c.id === s.activeClub ? ' aria-pressed="true"' : ' aria-pressed="false"') + '>'
      + crestFor(c) + '<span class="cn">' + c.name + '</span>'
      + '<span class="cd">' + (c.division || 'Challenger') + ' · #' + c.rank + '</span></button>';
  }).join('')
    + '<a class="clubchip add" href="club-builder.html?new=1">'
    + '<span class="rc plus">+</span><span class="cn">New club</span>'
    + '<span class="cd">Build another</span></a>';
  rail.querySelectorAll('[data-club]').forEach(function(b){
    b.addEventListener('click', function(){
      if(b.getAttribute('aria-pressed') === 'true') return;
      try {
        var c = FT.switchClub(b.dataset.club);
        showToast('Switched to ' + c.name + '.', 'success');
      } catch(e){ showToast(e.message, 'error'); }
    });
  });
}
function renderClubHead(){
  var s = FT.getState(), c = s.club;
  var set = function(id, v){ var e = document.getElementById(id); if(e) e.textContent = v; };
  set('clName', c.name);
  set('clValue', (c.value || 0).toLocaleString('en-US'));
  set('clFp', (c.fp || 0).toLocaleString('en-US'));
  set('clMeta', (c.division || 'Challenger') + ' division · +' + (c.boost || 0).toFixed(1) + '% boost');
  set('clRung', '#' + c.rank);
  set('clCount', s.clubs.length + (s.clubs.length === 1 ? ' club' : ' clubs')
    + ' · staking ' + c.name + ' this round');
  renderRail();
}
renderClubHead();
window.addEventListener('fantrade:statechange', renderClubHead);

var bp=document.getElementById('builderPitch');
var curShape='4-3-3';
var curColor='#1800ad';

function renderBuilder(shape){
  curShape=shape;
  XI=FORMS[shape] || FORMS['4-3-3'];
  var s=FT.getState();
  var cName=s.club.name||'Zero FC';
  var cStad=s.club.stadium||'Emirates of the North';
  var html=pitchHTML().replace('Zero FC', cName).replace('4-3-3 · Emirates of the North', shape+' · '+cStad);
  bp.innerHTML=html;
  var cr=bp.querySelector('.crest');
  if(cr) cr.style.background='linear-gradient(160deg,'+curColor+',rgba(0,0,0,.4))';
  var add=bp.querySelector('#addSub'), al=bp.querySelector('#ownAlert');
  if(add) add.addEventListener('click',function(){ var o=al.classList.toggle('show'); add.setAttribute('aria-expanded',o?'true':'false'); });
}

var NEWCLUB = /[?&]new=1/.test(window.location.search);

function syncClubUI(){
  var s=FT.getState();
  var c=s.club;
  curShape=c.formation||'4-3-3';
  curColor=c.color||'#1800ad';

  // building a second club starts from a blank name, not the one you already own
  var ni=document.getElementById('clubNameInput');
  if(ni && !NEWCLUB) ni.value=c.name;
  var si=document.getElementById('clubStadiumInput');
  if(si && !NEWCLUB) si.value=c.stadium;

  if(!NEWCLUB) document.querySelectorAll('h1').forEach(function(h){
    if(h.textContent.indexOf('Zero')!==-1 || h.textContent.indexOf(c.name)!==-1){
      h.textContent=c.name;
    }
  });

  document.querySelectorAll('.pitch-head').forEach(function(ph){
    var nm=ph.querySelector('.name');
    if(nm) nm.textContent=c.name;
    var mt=ph.querySelector('.meta');
    if(mt) mt.textContent=curShape+' · '+c.stadium+' · Est. 2026';
    var cr=ph.querySelector('.crest');
    if(cr) cr.style.background='linear-gradient(160deg,'+curColor+',rgba(0,0,0,.4))';
  });

  var myRow=document.getElementById('myClubLbRow');
  if(myRow){
    var cn=myRow.querySelector('.cn');
    if(cn){
      cn.innerHTML='<span class="mini-crest" style="background:linear-gradient(160deg,'+curColor+',rgba(0,0,0,.4))"></span>'+c.name;
    }
  }

  // update active buttons in formation
  document.querySelectorAll('#forms button').forEach(function(b){
    b.setAttribute('aria-pressed', b.textContent.trim()===curShape ? 'true' : 'false');
  });
}

if(bp){
  var savedClub=FT.getState().club;
  if(savedClub && savedClub.formation) curShape=savedClub.formation;
  if(savedClub && savedClub.color) curColor=savedClub.color;

  renderBuilder(curShape);
  syncClubUI();

  document.querySelectorAll('#forms button').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('#forms button').forEach(function(x){ x.setAttribute('aria-pressed','false'); });
      b.setAttribute('aria-pressed','true');
      renderBuilder(b.textContent.trim());
    });
  });
  document.querySelectorAll('.sw').forEach(function(s){
    s.addEventListener('click',function(){
      document.querySelectorAll('.sw').forEach(function(x){ x.setAttribute('aria-pressed','false'); });
      s.setAttribute('aria-pressed','true');
      var c=getComputedStyle(s).backgroundImage;
      curColor = s.style.background || '#1800ad';
      [bp.querySelector('.crest'), document.querySelector('#pitchMount .crest')].forEach(function(cr){
        if(cr) cr.style.backgroundImage=c;
      });
      var myRow=document.getElementById('myClubLbRow');
      if(myRow){
        var mc=myRow.querySelector('.mini-crest');
        if(mc) mc.style.backgroundImage=c;
      }
    });
  });
  document.querySelectorAll('#stepper button').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('#stepper button').forEach(function(x){ x.removeAttribute('aria-current'); });
      b.setAttribute('aria-current','step');
    });
  });

  var scb=document.getElementById('saveClubBtn');
  if(scb){
    scb.addEventListener('click',function(){
      var isNew = /[?&]new=1/.test(window.location.search);
      var name=(document.getElementById('clubNameInput').value||'').trim();
      var stadium=(document.getElementById('clubStadiumInput').value||'Unnamed ground').trim();
      if(name.length<2){ showToast("Give the club a name first.", "error"); return; }
      try {
        if(isNew){
          FT.createClub({ name: name, stadium: stadium, formation: curShape, color: curColor });
          showToast(name+" created and selected.", "success");
          setTimeout(function(){ window.location.href='clubs.html'; }, 900);
        } else {
          FT.saveClub({ name: name, stadium: stadium, formation: curShape, color: curColor });
          showToast(name+" ("+curShape+") saved.", "success");
        }
        syncClubUI();
      } catch(err){ showToast(err.message, "error"); }
    });
  }
}
